<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flags - TB</title>

    <!-- Preload fonts to prevent FOUT -->
    <link rel="preload" href="Fonts/OpenSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="Fonts/OpenSans-Medium.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="Fonts/OpenSans-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="Fonts/OpenSans-Bold.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Unified Stylesheet -->
    <link rel="stylesheet" href="css/tb.css">

    <!-- Theme Bridge -->
    <script src="js/theme-sync.js"></script>
</head>
<body>
    <main class="demo-shell glass-children" style="padding:24px">
        <div class="section-heading intro" style="margin-bottom:20px">
            <h1>Flags</h1>
            <p>Experimental browser features. Use with caution.</p>
        </div>

        <div style="display:flex;flex-direction:column;gap:6px;max-width:560px">
            <button class="flag-card" data-flag="split-view">
                <div class="flag-card-text">
                    <h4>Split-View</h4>
                    <p>Split the tab content area into two resizable panes side by side</p>
                </div>
                <span class="toggle-switch" id="split-view"><span class="knob"></span></span>
            </button>

            <button class="flag-card" data-flag="omni-bangs">
                <div class="flag-card-text">
                    <h4>Omni Bangs</h4>
                    <p>DuckDuckGo-style bang shortcuts in the address bar (e.g. !w Wikipedia)</p>
                </div>
                <span class="toggle-switch" id="omni-bangs"><span class="knob"></span></span>
            </button>

            <button class="flag-card" data-flag="gradient-shimmer">
                <div class="flag-card-text">
                    <h4>Gradient Shimmer</h4>
                    <p>Animated canvas-based shimmer effect on the new tab page background</p>
                </div>
                <span class="toggle-switch" id="gradient-shimmer"><span class="knob"></span></span>
            </button>

            <button class="flag-card" data-flag="hardware-acceleration">
                <div class="flag-card-text">
                    <h4>Hardware Acceleration</h4>
                    <p>Use GPU to render web content when available (requires restart)</p>
                </div>
                <span class="toggle-switch on" id="hardware-acceleration"><span class="knob"></span></span>
            </button>
        </div>

        <div style="margin-top:20px">
            <button class="button primary" style="gap:6px" onclick="window.chrome.webview.postMessage({action:'CLOSE_SETTINGS'})">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Back to browsing
            </button>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script>
        const toast = document.getElementById('toast');
        let toastTimeout;

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Flag toggle via card click
        document.querySelectorAll('.flag-card').forEach(card => {
            const toggle = card.querySelector('.toggle-switch');
            if (!toggle) return;
            card.addEventListener('click', () => {
                toggle.classList.toggle('on');
                const flag = card.dataset.flag;
                const value = toggle.classList.contains('on');
                showToast(flag + ' ' + (value ? 'enabled' : 'disabled'));
                window.chrome.webview.postMessage({ action: 'TOGGLE_FLAG', flag, value });
            });
        });

        window.chrome.webview.postMessage({ action: 'FLAGS_READY' });

        window.chrome.webview.addEventListener('message', event => {
            const msg = event.data;
            if (msg.action === 'FLAGS_DATA' && msg.flags) {
                for (const [key, value] of Object.entries(msg.flags)) {
                    const toggle = document.getElementById(key);
                    if (!toggle) continue;
                    toggle.classList.toggle('on', value);
                }
            }
        });
    </script>
</body>
</html>
