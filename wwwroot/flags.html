<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flags - TB</title>
    <link rel="stylesheet" href="css/tb.css">
    <script src="js/theme-sync.js"></script>
</head>
<body>
    <main class="demo-shell glass-children">
        <div class="section-heading intro">
            <h1>Flags</h1>
            <p>Experimental browser features. Use with caution.</p>
        </div>

        <div class="wide-stack">
            <button class="toggle-button card" data-toggle="split-view">
                <div class="toggle-text">
                    <h4>Split-View</h4>
                    <p>Split the tab content area into two resizable panes side by side</p>
                </div>
                <div class="toggle" id="split-view"><div class="runner"></div></div>
            </button>

            <button class="toggle-button card" data-toggle="omni-bangs">
                <div class="toggle-text">
                    <h4>Omni Bangs</h4>
                    <p>DuckDuckGo-style bang shortcuts in the address bar (e.g. !w Wikipedia)</p>
                </div>
                <div class="toggle" id="omni-bangs"><div class="runner"></div></div>
            </button>

            <button class="toggle-button card" data-toggle="gradient-shimmer">
                <div class="toggle-text">
                    <h4>Gradient Shimmer</h4>
                    <p>Animated canvas-based shimmer effect on the new tab page background</p>
                </div>
                <div class="toggle" id="gradient-shimmer"><div class="runner"></div></div>
            </button>

            <button class="toggle-button card" data-toggle="hardware-acceleration">
                <div class="toggle-text">
                    <h4>Hardware Acceleration</h4>
                    <p>Use GPU to render web content when available (requires restart)</p>
                </div>
                <div class="toggle enabled" id="hardware-acceleration"><div class="runner"></div></div>
            </button>
        </div>

        <div class="row">
            <button class="button primary" id="back-to-browser" style="gap:6px">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Back to browsing
            </button>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script>
        const toast = document.getElementById('toast');
        let toastTimeout;

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        document.querySelectorAll('.toggle-button.card[data-toggle]').forEach(card => {
            const toggle = card.querySelector('.toggle');
            if (!toggle) return;
            card.addEventListener('click', () => {
                toggle.classList.toggle('enabled');
                const flag = card.dataset.toggle;
                const value = toggle.classList.contains('enabled');
                showToast(flag + ' ' + (value ? 'enabled' : 'disabled'));
                window.chrome.webview.postMessage({ action: 'TOGGLE_FLAG', flag, value });
            });
        });

        document.getElementById('back-to-browser').addEventListener('click', (e) => {
            e.preventDefault();
            window.chrome.webview.postMessage({ action: 'CLOSE_SETTINGS' });
        });

        window.chrome.webview.postMessage({ action: 'FLAGS_READY' });

        window.chrome.webview.addEventListener('message', event => {
            const msg = event.data;
            if (msg.action === 'FLAGS_DATA' && msg.flags) {
                for (const [key, value] of Object.entries(msg.flags)) {
                    const toggle = document.getElementById(key);
                    if (!toggle) continue;
                    toggle.classList.toggle('enabled', value);
                }
            }
        });
    </script>
</body>
</html>
